<svg xmlns="http://www.w3.org/2000/svg" width="880" height="802" viewBox="0 0 880 802" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="filled" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#222" stroke-width="1.2"/></marker></defs><text x="440" y="28" text-anchor="middle" font-size="15" font-weight="bold">Mediator Pattern - Sequence: offline delivery and a group message</text><text x="440" y="46" text-anchor="middle" font-size="11" fill="#555">CampusConnect Messenger (Messenger-like) - CSE 3206 Lab 3, Group 7</text><rect x="30.0" y="68" width="139.0" height="44" rx="4" fill="#FFF8E1" stroke="#8A6A1F" stroke-width="1.3"/><text x="99.5" y="84" text-anchor="middle" font-size="10" fill="#8A6A1F">«ConcreteColleague»</text><text x="99.5" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" text-decoration="underline">kafi : Member</text><rect x="239.6" y="68" width="202.2" height="44" rx="4" fill="#E3EEFA" stroke="#2B5C8A" stroke-width="1.3"/><text x="340.7" y="84" text-anchor="middle" font-size="10" fill="#2B5C8A">«ConcreteMediator»</text><text x="340.7" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" text-decoration="underline">server : MessengerServer</text><rect x="501.8" y="68" width="139.0" height="44" rx="4" fill="#FFF8E1" stroke="#8A6A1F" stroke-width="1.3"/><text x="571.3" y="84" text-anchor="middle" font-size="10" fill="#8A6A1F">«ConcreteColleague»</text><text x="571.3" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" text-decoration="underline">sakila : Member</text><rect x="700.9" y="68" width="139.0" height="44" rx="4" fill="#FFF8E1" stroke="#8A6A1F" stroke-width="1.3"/><text x="770.4" y="84" text-anchor="middle" font-size="10" fill="#8A6A1F">«ConcreteColleague»</text><text x="770.4" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" text-decoration="underline">sadaf : Member</text><line x1="99.5" y1="112" x2="99.5" y2="778" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5,4"/><line x1="340.7" y1="112" x2="340.7" y2="778" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5,4"/><line x1="571.3" y1="112" x2="571.3" y2="778" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5,4"/><line x1="770.4" y1="112" x2="770.4" y2="778" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5,4"/><rect x="39.5" y="562" width="701.8" height="102" fill="#F7F9FC" stroke="#5B6B7F" stroke-width="1"/><line x1="14" y1="132" x2="866" y2="132" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2,3"/><rect x="276.1" y="121" width="327.6" height="22" rx="3" fill="#EEF2F7" stroke="#8a8a8a"/><text x="439.9" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2B3A4A">Scenario A - direct message to an offline user</text><path d="M571.3,160 h34 v18 h-32" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="611.3" y="173" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">goOffline(): online_ = false</text><line x1="571.3" y1="204" x2="342.7" y2="204" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="456.0" y="198" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">presenceChanged(sakila)</text><line x1="99.5" y1="238" x2="338.7" y2="238" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="220.1" y="232" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">sendDirect(kafi, &quot;sakila&quot;, text)</text><path d="M340.7,264 h34 v18 h-32" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="380.7" y="277" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">not blocked -&gt; makeMessage(), history_.push_back()</text><path d="M340.7,300 h34 v18 h-32" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="380.7" y="313" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">deliver(): offline -&gt; pending_[&quot;sakila&quot;].push_back()</text><line x1="340.7" y1="344" x2="101.5" y2="344" stroke="#222" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="220.1" y="338" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">DeliveryStatus::Queued</text><path d="M571.3,370 h34 v18 h-32" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="611.3" y="383" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">goOnline(): online_ = true</text><line x1="571.3" y1="414" x2="342.7" y2="414" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="456.0" y="408" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">presenceChanged(sakila)</text><line x1="340.7" y1="448" x2="569.3" y2="448" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="456.0" y="442" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">receive(msg)   [flush queue]</text><line x1="14" y1="476" x2="866" y2="476" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2,3"/><rect x="302.5" y="465" width="274.8" height="22" rx="3" fill="#EEF2F7" stroke="#8a8a8a"/><text x="439.9" y="480" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2B3A4A">Scenario B - group message to #Group-7</text><line x1="770.4" y1="512" x2="342.7" y2="512" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="555.5" y="506" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">sendToGroup(sadaf, &quot;Group-7&quot;, text)</text><path d="M340.7,538 h34 v18 h-32" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="380.7" y="551" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">member? else throw PermissionDenied</text><line x1="340.7" y1="610" x2="101.5" y2="610" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="220.1" y="604" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">receive(msg)</text><line x1="340.7" y1="644" x2="569.3" y2="644" stroke="#222" stroke-width="1.2" marker-end="url(#filled)"/><text x="456.0" y="638" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">receive(msg)</text><path d="M39.5,562 h41.3 v14 l-6,6 h-35.3 z" fill="#DDE5EF" stroke="#5B6B7F"/><text x="45.5" y="576" font-size="11" font-weight="bold">loop</text><text x="88.8" y="576" font-size="11" fill="#333">[ each member != sender and not blocking sender ]</text><line x1="340.7" y1="684" x2="768.4" y2="684" stroke="#222" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="555.5" y="678" text-anchor="middle" font-size="11.5" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2  (members reached)</text><path d="M59.5,706 h740.9 l10,10 v30 h-750.9 z" fill="#FFFBE6" stroke="#B59F3B" stroke-width="1"/><text x="434.9" y="722" text-anchor="middle" font-size="11" fill="#5a4a00">Kafi, Sakila and Sadaf never call each other:</text><text x="434.9" y="737" text-anchor="middle" font-size="11" fill="#5a4a00">every arrow starts or ends at the MessengerServer (the mediator).</text></svg>