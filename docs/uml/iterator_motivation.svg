<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker><marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 z" fill="white" stroke="#444"/></marker></defs><text x="550.0" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">Why Iterator? Client coupled to storage vs. one traversal interface</text><rect x="20" y="50" width="520" height="430" rx="10" fill="#FCF4F4" stroke="#A33A3A" stroke-width="1.5"/><text x="280.0" y="76" text-anchor="middle" font-size="14" fill="#A33A3A" font-weight="bold">WITHOUT Iterator: the UI walks raw containers</text><rect x="560" y="50" width="520" height="430" rx="10" fill="#F4FAF6" stroke="#2E6B3F" stroke-width="1.5"/><text x="820.0" y="76" text-anchor="middle" font-size="14" fill="#2E6B3F" font-weight="bold">WITH Iterator: the UI walks one interface</text><rect x="180" y="95" width="200" height="46" rx="6" fill="#E6F4EA" stroke="#2E6B3F" stroke-width="1.4"/><text x="280.0" y="115.0" text-anchor="middle" font-size="12" font-weight="bold">FeedScreen (UI)</text><text x="280.0" y="131.0" text-anchor="middle" font-size="10" fill="#555">contains 3 different loops</text><line x1="280.0" y1="141.0" x2="120.0" y2="262.0" stroke="#A33A3A" stroke-width="1.4" marker-end="url(#arr)"/><rect x="45" y="265" width="150" height="50" rx="6" fill="#F2F2F2" stroke="#666" stroke-width="1.4"/><text x="120.0" y="294.0" text-anchor="middle" font-size="11" font-weight="bold">std::map&lt;id, Profile&gt;</text><text x="120" y="335" text-anchor="middle" font-size="10" fill="#7a2a2a" font-weight="normal">for (auto&amp; [id, p] : profiles)</text><line x1="280.0" y1="141.0" x2="285.0" y2="262.0" stroke="#A33A3A" stroke-width="1.4" marker-end="url(#arr)"/><rect x="210" y="265" width="150" height="50" rx="6" fill="#F2F2F2" stroke="#666" stroke-width="1.4"/><text x="285.0" y="294.0" text-anchor="middle" font-size="11" font-weight="bold">friendship graph</text><text x="285" y="335" text-anchor="middle" font-size="10" fill="#7a2a2a" font-weight="normal">BFS for &#x27;People You May Know&#x27;</text><line x1="280.0" y1="141.0" x2="450.0" y2="262.0" stroke="#A33A3A" stroke-width="1.4" marker-end="url(#arr)"/><rect x="375" y="265" width="150" height="50" rx="6" fill="#F2F2F2" stroke="#666" stroke-width="1.4"/><text x="450.0" y="294.0" text-anchor="middle" font-size="11" font-weight="bold">std::vector&lt;Post&gt;</text><text x="450" y="335" text-anchor="middle" font-size="10" fill="#7a2a2a" font-weight="normal">filter + sort by time, by hand</text><text x="280" y="385" text-anchor="middle" font-size="11.5" fill="#A33A3A" font-weight="bold">UI depends on every internal data structure.</text><text x="280" y="405" text-anchor="middle" font-size="11" fill="#333" font-weight="normal">Change vector -&gt; database, or add a new traversal</text><text x="280" y="421" text-anchor="middle" font-size="11" fill="#333" font-weight="normal">(e.g. &#x27;Top posts&#x27;), and the UI code must be edited.</text><text x="280" y="441" text-anchor="middle" font-size="11" fill="#333" font-weight="normal">Two scrolls at once? Each loop keeps its own messy index.</text><rect x="720" y="95" width="200" height="46" rx="6" fill="#E6F4EA" stroke="#2E6B3F" stroke-width="1.4"/><text x="820.0" y="115.0" text-anchor="middle" font-size="12" font-weight="bold">FeedScreen (UI)</text><text x="820.0" y="131.0" text-anchor="middle" font-size="10" fill="#555">one loop: while (it.hasNext())</text><line x1="820.0" y1="141.0" x2="820.0" y2="176.0" stroke="#444" stroke-width="1.4" marker-end="url(#arr)"/><rect x="725" y="178" width="190" height="46" rx="6" fill="#E3EEFA" stroke="#2B5C8A" stroke-width="1.4"/><text x="820.0" y="198.0" text-anchor="middle" font-size="12" font-weight="bold">Iterator&lt;T&gt;</text><text x="820.0" y="214.0" text-anchor="middle" font-size="10" fill="#555">hasNext()  next()  reset()</text><line x1="660" y1="268" x2="780" y2="226" stroke="#444" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#tri)"/><rect x="585" y="270" width="150" height="40" rx="6" fill="#FFF8E1" stroke="#8A6A1F" stroke-width="1.4"/><text x="660.0" y="294.0" text-anchor="middle" font-size="11" font-weight="bold">FriendsIterator</text><line x1="660.0" y1="310.0" x2="790.0" y2="338.0" stroke="#8A6A1F" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/><line x1="825" y1="268" x2="820" y2="226" stroke="#444" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#tri)"/><rect x="750" y="270" width="150" height="40" rx="6" fill="#FFF8E1" stroke="#8A6A1F" stroke-width="1.4"/><text x="825.0" y="294.0" text-anchor="middle" font-size="11" font-weight="bold">SuggestionsIterator</text><line x1="825.0" y1="310.0" x2="820.0" y2="338.0" stroke="#8A6A1F" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/><line x1="990" y1="268" x2="860" y2="226" stroke="#444" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#tri)"/><rect x="915" y="270" width="150" height="40" rx="6" fill="#FFF8E1" stroke="#8A6A1F" stroke-width="1.4"/><text x="990.0" y="294.0" text-anchor="middle" font-size="11" font-weight="bold">NewsFeedIterator</text><line x1="990.0" y1="310.0" x2="850.0" y2="338.0" stroke="#8A6A1F" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/><rect x="700" y="340" width="240" height="36" rx="6" fill="#FFF8E1" stroke="#8A6A1F" stroke-width="1.4"/><text x="820.0" y="362.0" text-anchor="middle" font-size="11" font-weight="bold">CampusConnect (storage hidden)</text><text x="820" y="403" text-anchor="middle" font-size="11.5" fill="#2E6B3F" font-weight="bold">UI depends only on Iterator&lt;T&gt;.</text><text x="820" y="423" text-anchor="middle" font-size="11" fill="#333" font-weight="normal">New traversal = new class; storage can change freely.</text><text x="820" y="441" text-anchor="middle" font-size="11" fill="#333" font-weight="normal">Many independent iterators can run at the same time.</text></svg>