<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker><marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 z" fill="white" stroke="#444"/></marker></defs><text x="550.0" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">Why Mediator? Direct coupling vs. a central mediator</text><rect x="20" y="50" width="520" height="450" rx="10" fill="#FCF4F4" stroke="#A33A3A" stroke-width="1.5"/><text x="280.0" y="76" text-anchor="middle" font-size="14" fill="#A33A3A" font-weight="bold">WITHOUT Mediator: every user knows every user</text><rect x="560" y="50" width="520" height="450" rx="10" fill="#F4FAF6" stroke="#2E6B3F" stroke-width="1.5"/><text x="820.0" y="76" text-anchor="middle" font-size="14" fill="#2E6B3F" font-weight="bold">WITH Mediator: users know only the server</text><line x1="280.0" y1="125.0" x2="413.1" y2="221.7" stroke="#C06060" stroke-width="1.6"/><line x1="280.0" y1="125.0" x2="362.3" y2="378.3" stroke="#C06060" stroke-width="1.6"/><line x1="280.0" y1="125.0" x2="197.7" y2="378.3" stroke="#C06060" stroke-width="1.6"/><line x1="280.0" y1="125.0" x2="146.9" y2="221.7" stroke="#C06060" stroke-width="1.6"/><line x1="413.1" y1="221.7" x2="362.3" y2="378.3" stroke="#C06060" stroke-width="1.6"/><line x1="413.1" y1="221.7" x2="197.7" y2="378.3" stroke="#C06060" stroke-width="1.6"/><line x1="413.1" y1="221.7" x2="146.9" y2="221.7" stroke="#C06060" stroke-width="1.6"/><line x1="362.3" y1="378.3" x2="197.7" y2="378.3" stroke="#C06060" stroke-width="1.6"/><line x1="362.3" y1="378.3" x2="146.9" y2="221.7" stroke="#C06060" stroke-width="1.6"/><line x1="197.7" y1="378.3" x2="146.9" y2="221.7" stroke="#C06060" stroke-width="1.6"/><rect 